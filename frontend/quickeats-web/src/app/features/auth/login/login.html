<div class="login-container">

    <h1>Login</h1>

    <input
        type="email"
        placeholder="Email"
        [(ngModel)]="loginUser.email">

    <input
        type="password"
        placeholder="Password"
        [(ngModel)]="loginUser.password">

    <button
        (click)="login()">

        Login

    </button>

</div>
