

<h1>Create Account</h1>

<p>Please fill your details</p>



<label>Name</label>

<input

type="text"

placeholder="Enter Name"

[(ngModel)]="user.name"

>



<label>Email</label>

<input

type="email"

placeholder="Enter Email"

[(ngModel)]="user.email"

>




<label>Password</label>

<input

type="password"

placeholder="Enter Password"

[(ngModel)]="user.password"

>
<label>Phone Number</label>

<input
type="text"
[(ngModel)]="user.phoneNumber"
name="phoneNumber">

<label>Register As</label>

<select
    [(ngModel)]="user.role"
    name="role">

    <option value="Customer">
        Customer
    </option>

    <option value="Owner">
        Restaurant Owner
    </option>

    <option value="DeliveryPartner">
        Delivery Partner
    </option>

</select>



<button

(click)="register()"

>

Register

</button>
