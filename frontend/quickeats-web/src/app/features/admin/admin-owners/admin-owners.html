<app-admin-nav></app-admin-nav>

<h1>Restaurant Owners</h1>

@if(owners.length===0){

<h2>No Owners Found</h2>

}

@else{

<table>

<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Phone</th>

<th>Joined</th>

</tr>

</thead>

<tbody>

@for(owner of owners; track owner.id){

<tr>

<td>{{owner.name}}</td>

<td>{{owner.email}}</td>

<td>{{owner.phoneNumber}}</td>

<td>{{owner.createdAt | date:'mediumDate'}}</td>

</tr>

}

</tbody>

</table>

}
