<app-admin-nav></app-admin-nav>

<h1>Menu Categories</h1>

<div class="add-row">
    <input
        type="text"
        placeholder="New category name"
        [(ngModel)]="newName"
        (keyup.enter)="addCategory()">
    <button class="btn-add" (click)="addCategory()" [disabled]="!newName.trim()">Add Category</button>
</div>

@if(categories.length === 0){
    <p class="empty">No Categories Found</p>
}
@else{
    <table>
        <thead>
            <tr>
                <th>Category</th>
                <th>Menu Items</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            @for(cat of categories; track cat.id){
                <tr>
                    <td>
                        @if(editId === cat.id){
                            <input
                                type="text"
                                [(ngModel)]="editName"
                                (keyup.enter)="saveEdit()"
                                (keyup.escape)="cancelEdit()">
                        }
                        @else{
                            {{cat.name}}
                        }
                    </td>
                    <td>{{cat.menuItemCount}}</td>
                    <td class="actions">
                        @if(editId === cat.id){
                            <button class="btn-save" (click)="saveEdit()">Save</button>
                            <button class="btn-cancel" (click)="cancelEdit()">Cancel</button>
                        }
                        @else{
                            <button class="btn-edit" (click)="startEdit(cat)">Edit</button>
                            <button class="btn-delete" (click)="deleteCategory(cat.id)">Delete</button>
                        }
                    </td>
                </tr>
            }
        </tbody>
    </table>
}
