<h1>Edit Menu</h1>

@if(menu){

<input
type="number"
[(ngModel)]="menu.restaurantId"
disabled>

<input
type="text"
[(ngModel)]="menu.name">

<input
type="text"
[(ngModel)]="menu.description">

<input
type="number"
[(ngModel)]="menu.price">

<input
type="text"
[(ngModel)]="menu.imageUrl">

<select
[(ngModel)]="menu.category">

<option value="Starters">Starters</option>
<option value="Main Course">Main Course</option>
<option value="Biryani">Biryani</option>
<option value="Pizza">Pizza</option>
<option value="Burgers">Burgers</option>
<option value="Desserts">Desserts</option>
<option value="Beverages">Beverages</option>

</select>

<select
[(ngModel)]="menu.isVeg">

<option [ngValue]="true">Veg</option>
<option [ngValue]="false">Non-Veg</option>

</select>

<input
type="checkbox"
[(ngModel)]="menu.isAvailable">

<input
type="checkbox"
[(ngModel)]="menu.isBestseller">

<input
type="number"
[(ngModel)]="menu.discountPercent">

<button
(click)="updateMenu()">

Update Menu

</button>

}
