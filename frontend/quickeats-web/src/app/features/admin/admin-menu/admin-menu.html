<h1>Menu Management</h1>

<button
(click)="addMenu()">

Add Menu

</button>

@if(menus.length===0){

<h2>No Menu Found</h2>

}

@else{

<table>

<thead>

<tr>

<th>Name</th>

<th>Price</th>

<th>Restaurant</th>

<th>Action</th>

</tr>

</thead>

<tbody>

@for(menu of menus; track menu.id){

<tr>

<td>{{menu.name}}</td>

<td>{{menu.price}}</td>

<td>{{menu.restaurantId}}</td>

<td>

<button
(click)="editMenu(menu)">

Edit

</button>

<button

(click)="deleteMenu(menu.id)">

Delete

</button>

</td>

</tr>
o
}

</tbody>

</table>

}
