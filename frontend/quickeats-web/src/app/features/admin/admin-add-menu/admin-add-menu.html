<h1>Add New Menu Item</h1>

<form (ngSubmit)="saveMenu()">

    <!--
        Restaurant ID

        Customer/Admin enters the Restaurant Id.
        This tells Backend which restaurant
        this food item belongs to.
    -->
    <label>
        Restaurant ID
    </label>

    <input
        type="number"
        name="restaurantId"
        [(ngModel)]="menu.restaurantId"
        required
    >


    <!--
        Food Name

        [(ngModel)]
        Means:
        Whatever user types here is stored
        inside menu.name.
    -->
    <label>
        Food Name
    </label>

    <input
        type="text"
        name="name"
        [(ngModel)]="menu.name"
        required
    >


    <!-- Food Description -->

    <label>
        Description
    </label>

    <textarea
        name="description"
        [(ngModel)]="menu.description"
        required
    ></textarea>


    <!-- Food Price -->

    <label>
        Price
    </label>

    <input
        type="number"
        name="price"
        [(ngModel)]="menu.price"
        required
    >


    <!-- Food Image URL -->

    <label>
        Image URL
    </label>

    <input
        type="text"
        name="imageUrl"
        [(ngModel)]="menu.imageUrl"
    >


    <!--
        Availability

        true  = Available
        false = Not Available
    -->

    <label>
        Available
    </label>

    <input
        type="checkbox"
        name="isAvailable"
        [(ngModel)]="menu.isAvailable"
    >


    <!-- Food Category -->

    <label>
        Category
    </label>

    <select
        name="category"
        [(ngModel)]="menu.category"
    >

        <option value="Starters">Starters</option>
        <option value="Main Course">Main Course</option>
        <option value="Biryani">Biryani</option>
        <option value="Pizza">Pizza</option>
        <option value="Burgers">Burgers</option>
        <option value="Desserts">Desserts</option>
        <option value="Beverages">Beverages</option>

    </select>


    <!-- Veg / Non-Veg -->

    <label>
        Veg / Non-Veg
    </label>

    <select
        name="isVeg"
        [(ngModel)]="menu.isVeg"
    >

        <option [ngValue]="true">Veg</option>
        <option [ngValue]="false">Non-Veg</option>

    </select>


    <!-- Bestseller -->

    <label>
        Bestseller
    </label>

    <input
        type="checkbox"
        name="isBestseller"
        [(ngModel)]="menu.isBestseller"
    >


    <!-- Discount Percent -->

    <label>
        Discount Percent
    </label>

    <input
        type="number"
        name="discountPercent"
        [(ngModel)]="menu.discountPercent"
    >


    <!--
        ngSubmit

        When button is clicked,
        Angular calls saveMenu().
    -->

    <button
        type="submit">

        Add Menu

    </button>

</form>
