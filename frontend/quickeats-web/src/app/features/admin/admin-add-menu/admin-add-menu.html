<h1>Add New Menu Item</h1>

<form (ngSubmit)="saveMenu()">

    <!--
        Restaurant ID

        Customer/Admin enters the Restaurant Id.
        This tells Backend which restaurant
        this food item belongs to.
    -->
    <label>
        Restaurant ID
    </label>

    <input
        type="number"
        name="restaurantId"
        [(ngModel)]="menu.restaurantId"
        required
    >


    <!--
        Food Name

        [(ngModel)]
        Means:
        Whatever user types here is stored
        inside menu.name.
    -->
    <label>
        Food Name
    </label>

    <input
        type="text"
        name="name"
        [(ngModel)]="menu.name"
        required
    >


    <!-- Food Description -->

    <label>
        Description
    </label>

    <textarea
        name="description"
        [(ngModel)]="menu.description"
        required
    ></textarea>


    <!-- Food Price -->

    <label>
        Price
    </label>

    <input
        type="number"
        name="price"
        [(ngModel)]="menu.price"
        required
    >


    <!-- Food Image URL -->

    <label>
        Image URL
    </label>

    <input
        type="text"
        name="imageUrl"
        [(ngModel)]="menu.imageUrl"
    >


    <!--
        Availability

        true  = Available
        false = Not Available
    -->

    <label>
        Available
    </label>

    <input
        type="checkbox"
        name="isAvailable"
        [(ngModel)]="menu.isAvailable"
    >


    <!--
        ngSubmit

        When button is clicked,
        Angular calls saveMenu().
    -->

    <button
        type="submit">

        Add Menu

    </button>

</form>
