<app-admin-nav></app-admin-nav>

<h1>Customers</h1>

@if(users.length===0){

<h2>No Customers Found</h2>

}

@else{

<table>

<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Phone</th>

<th>Joined</th>

</tr>

</thead>

<tbody>

@for(user of users; track user.id){

<tr>

<td>{{user.name}}</td>

<td>{{user.email}}</td>

<td>{{user.phoneNumber}}</td>

<td>{{user.createdAt | date:'mediumDate'}}</td>

</tr>

}

</tbody>

</table>

}
