<app-owner-nav></app-owner-nav>

<div class="owner-page form-page">

    <h1>

        @if(isEdit){
            Edit Restaurant
        }
        @else{
            Add Restaurant
        }

    </h1>

    <label>Restaurant Name</label>

    <input
        type="text"
        placeholder="Enter Name"
        [(ngModel)]="restaurant.name">

    <label>Description</label>

    <textarea
        placeholder="Describe your restaurant"
        [(ngModel)]="restaurant.description"></textarea>

    <label>Address</label>

    <input
        type="text"
        placeholder="Enter Address"
        [(ngModel)]="restaurant.address">

    <label>Phone Number</label>

    <input
        type="text"
        placeholder="Enter Phone Number"
        [(ngModel)]="restaurant.phoneNumber">

    <label>Image URL</label>

    <input
        type="text"
        placeholder="assets/images/restaurants/..." 
        [(ngModel)]="restaurant.imageUrl">

    <button
        class="save-btn"
        (click)="saveRestaurant()">

        Save Restaurant

    </button>

</div>
