<section class="hero">
  <div class="overlay">
    <div class="hero-content">
      <h1> Delicious Food, <span>Delivered Fast.</span></h1>
      <p> Order from your favourite restaurants near you. </p>
      <div class="search-box">
        <input
            type="text"
            placeholder="Search restaurants by name or location..."
            [(ngModel)]="searchText"
            (ngModelChange)="onSearch()">
        <button (click)="onSearch()"> Explore </button>
      </div>
    </div>
  </div>
</section>

<!-- Filter Bar -->
<section class="filter-bar">
    <div class="filter-group">
        <span class="filter-label">Filters:</span>

        <button
            class="filter-chip"
            [class.active]="showOpenOnly"
            (click)="toggleOpen()">
            🟢 Open
        </button>

        <button
            class="filter-chip"
            [class.active]="showClosedOnly"
            (click)="toggleClosed()">
            🔴 Closed
        </button>

        <button
            class="filter-chip"
            [class.active]="minRating === 4"
            (click)="setMinRating(4)">
            ⭐ 4+ Rating
        </button>

        <button
            class="filter-chip"
            [class.active]="minRating === 3"
            (click)="setMinRating(3)">
            ⭐ 3+ Rating
        </button>
    </div>
    <p class="result-count">{{ filteredRestaurants().length }} restaurants found</p>
</section>

<!-- for category section -->
<section class="categories">
    <div class="section-title">
        <h2>Popular Categories</h2>
        <p>Explore your favourite food categories</p>
    </div>

    <div class="category-grid">
        <div class="category-card">
            <img src="assets/images/categories/pizza.png">
            <h3>Pizza</h3>
        </div>
        <div class="category-card">
            <img src="assets/images/categories/burger.png">
            <h3>Burger</h3>
        </div>
        <div class="category-card">
            <img src="assets/images/categories/biryani.png">
            <h3>Biryani</h3>
        </div>
        <div class="category-card">
            <img src="assets/images/categories/sushi.png">
            <h3>Sushi</h3>
        </div>
        <div class="category-card">
            <img src="assets/images/categories/dessert.png">
            <h3>Dessert</h3>
        </div>
        <div class="category-card">
            <img src="assets/images/categories/drink.png">
            <h3>Drinks</h3>
        </div>
    </div>
</section>

@if (isLoading()) {

<app-loading-spinner message="Loading restaurants..."></app-loading-spinner>

}
@else {

<app-featured-restaurants
    [restaurants]="filteredRestaurants()">
</app-featured-restaurants>

}
