<div class="cart-container">

    <h1>My Cart</h1>

    @if(cartItems().length === 0){

        <div class="empty-cart">

            <h2>Your Cart is Empty</h2>

            <p>Add some delicious food.</p>

        </div>

    }
    @else{

        @for(item of cartItems(); track item.menu.id){

        <div class="cart-card">

            <img
                [src]="'assets/images/menu/' + item.menu.imageUrl"
                [alt]="item.menu.name">

            <div class="cart-details">

                <h3>{{ item.menu.name }}</h3>

                <p>{{ item.menu.description }}</p>

                <h4>₹{{ item.menu.price }}</h4>

            </div>

            <div class="quantity-section">

                <button
                    (click)="decreaseQuantity(item.menu.id)">

                    -

                </button>

                <span>{{ item.quantity }}</span>

                <button
                    (click)="increaseQuantity(item.menu.id)">

                    +

                </button>

            </div>

            <button
                class="remove-btn"
                (click)="removeItem(item.menu.id)">

                Remove

            </button>

        </div>

        }

        <div class="cart-total">

            <h2>

                Total :

                ₹{{ getTotalPrice() }}

            </h2>

            <button>

                Proceed To Checkout

            </button>

        </div>

    }

</div>
