<div class="dashboard-container">

    <div class="welcome-section">

        <h1>

            {{dashboardHeading}}

        </h1>

        <h2>

            {{customerName}}

        </h2>

        <p>

            Reward Points :

            <strong>

                {{rewardPoints}}

            </strong>

        </p>

    </div>

    <div class="dashboard-grid">

        <div

            class="dashboard-card"

            (click)="openOrders()">

            <h2>📦</h2>

            <h3>My Orders</h3>

            <p>

                {{totalOrders}}

            </p>

        </div>

        <div

            class="dashboard-card"

            (click)="openWishlist()">

            <h2>❤️</h2>

            <h3>Wishlist</h3>

            <p>

                {{favouriteRestaurants}}

            </p>

        </div>

        <div

            class="dashboard-card"

            (click)="openAddresses()">

            <h2>📍</h2>

            <h3>Saved Address</h3>

            <p>

                {{savedAddresses}}

            </p>

        </div>

        <div

            class="dashboard-card"

            (click)="openCoupons()">

            <h2>🎁</h2>

            <h3>Coupons</h3>

            <p>

                {{availableCoupons}}

            </p>

        </div>

        <div

            class="dashboard-card"

            (click)="openNotifications()">

            <h2>🔔</h2>

            <h3>Notifications</h3>

        </div>

        <div

            class="dashboard-card"

            (click)="openProfile()">

            <h2>👤</h2>

            <h3>My Profile</h3>

        </div>

    </div>

    <div class="logout-section">

        <button

            (click)="logout()">

            Logout

        </button>

    </div>

</div>
